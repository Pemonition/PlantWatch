name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      # Restore is a separate step so that a dependency failure is distinguishable
      # from a compilation failure in the job log.
      - name: Restore
        run: dotnet restore PlantWatch.sln

      - name: Build
        run: dotnet build PlantWatch.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test PlantWatch.sln --configuration Release --no-build --verbosity normal
