# Development broker configuration.
#
# Anonymous access is enabled deliberately: this file exists so that anyone can clone the
# repository and see telemetry flowing in one command. It is NOT a production configuration.
# A real plant deployment adds a password file (or mTLS), binds to the plant VLAN only, and
# restricts each gateway to its own topic with an ACL file.

listener 1883 0.0.0.0
allow_anonymous true

# Keep the broker chatty enough to debug a failing subscription, quiet enough to read.
log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true

# Persistence is off: telemetry durability is Postgres's job, not the broker's.
persistence false
