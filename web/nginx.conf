# nginx configuration for the PlantWatch dashboard container.
#
# Two jobs: serve the built Angular bundle as a single-page application, and put the API on the
# same origin as the page by proxying `/api`, `/hubs`, `/health` and `/swagger` to the api
# service. Same origin means no CORS preflight, no credentialed-origin allowlist to keep in
# sync with a deployment, and no API URL baked into the JavaScript bundle. See ADR 0005.

# SignalR negotiates to a WebSocket, which requires the Upgrade/Connection hop-by-hop headers to
# be forwarded explicitly — nginx drops them by default. Without this map the hub silently falls
# back to long polling, which works but reconnects badly and doubles the request count.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream plantwatch_api {
    server api:8080;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The Angular build emits hashed filenames, so text compression is the only transfer win
    # left. SVG is included because the icons and the chart are inline SVG in the HTML.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    # --- API ---------------------------------------------------------------
    location /api/ {
        proxy_pass http://plantwatch_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://plantwatch_api;
        proxy_set_header Host $host;
    }

    # Swagger UI is development-only on the API but is the fastest way for a reviewer to poke
    # the contract, so it is reachable from the same port as the dashboard.
    location /swagger {
        proxy_pass http://plantwatch_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Realtime ----------------------------------------------------------
    location /hubs/ {
        proxy_pass http://plantwatch_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A healthy hub is silent between readings; the default 60s read timeout would cut an
        # idle machine's connection and make the dashboard reconnect for no reason.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }

    # --- Static ------------------------------------------------------------
    # Hashed assets are immutable by construction, so they are cached hard.
    location ~* \.(?:js|css|woff2?|svg|png|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached: it is the file that points at the hashed bundles, so a
    # cached copy pins a browser to a deployment that no longer exists.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
